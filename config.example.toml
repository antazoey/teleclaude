# teleclaude config. Copy to ~/.config/teleclaude/config.toml (or point TELECLAUDE_CONFIG at it)
# and chmod 600, since it holds secrets. Environment variables override every setting shown.

# Which registered channel to use: telegram or minecraft.
channel = "telegram"
# Sends only ASCII, replacing or dropping everything else (emoji, curly quotes, dashes). On by
# default for minecraft, whose chat font has no emoji. Env: TELECLAUDE_ASCII_ONLY.
# ascii_only = false

[telegram]
# Daemon side: the bot token from @BotFather. Env: TELEGRAM_BOT_TOKEN or BOT_API_KEY.
bot_token = "123456:ABC-your-token-here"
# Daemon side: the one account the bot answers. Left unset, the first sender pairs and is
# written to .env next to daemon.py. Env: TELEGRAM_USER_ID.
# user_id = 123456789

# Client side: the bot to talk to, and your app credentials from https://my.telegram.org/apps.
# Env: TELEGRAM_BOT_USERNAME, TELEGRAM_API_ID (or TELECLAUDE_APP_ID), TELEGRAM_API_HASH (or
# TELEGRAM_API_KEY).
bot_username = "your_teleclaude_bot"
api_id = 12345678
api_hash = "0123456789abcdef0123456789abcdef"
# session = "~/.config/teleclaude/telegram"

[minecraft]
# Daemon side only: a Minecraft server's chat, read from its log and answered over RCON. Players
# address Claude by starting a chat message with the prefix. Env: MINECRAFT_LOG,
# MINECRAFT_RCON_HOST, MINECRAFT_RCON_PORT, MINECRAFT_RCON_PASSWORD, MINECRAFT_PREFIX.
# log = "~/servers/minecraft/data/logs/latest.log"
# rcon_host = "127.0.0.1"
# rcon_port = 25575
# rcon_password = "from server.properties"
# prefix = "@claude"
# The one player Claude answers. Left unset, the first player to use the prefix pairs and is
# written to .env next to daemon.py. Env: MINECRAFT_USER_ID.
# player = "your_minecraft_name"
# Said once to every other player on their first join, with {player} filled in. Empty turns it
# off. Env: MINECRAFT_GREETING.
# greeting = "Hi {player}! I am Claude, let me know if I can help :)"
# Where the greeted players are remembered. Env: MINECRAFT_GREETED.
# greeted = "~/.config/teleclaude/minecraft-greeted.json"

[daemon]
# Where Claude turns start. Env: CLAUDE_WORKDIR.
workdir = "~"
# Env: CLAUDE_BIN, UV_BIN, CLAUDE_MODEL.
claude_bin = "~/.local/bin/claude"
# uv_bin = "~/.local/bin/uv"
# model = "opus"
# Runs Claude with --dangerously-skip-permissions, since nobody can answer a prompt remotely.
# Env: SKIP_PERMISSIONS.
skip_permissions = true
# Raw tool input instead of plain descriptions. Env: TELECLAUDE_DEBUG.
debug = false
# Local Whisper model for voice memos: tiny, base, small, medium or large-v3. Bigger is slower
# and more accurate. Env: TELECLAUDE_WHISPER_MODEL.
# whisper_model = "small"

# Optional /diff: a web viewer that checks an HMAC-signed expiry.
# Env: TELECLAUDE_DIFF_URL, TELECLAUDE_DIFF_AUTH_KEY.
# diff_url = "https://diff.example.com"
# diff_auth_key = "shared-secret"

# Optional /clean: a script run with --force that writes a JSON status file.
# clean_script = "~/bin/clean.sh"
# clean_status = "~/bin/clean-status.json"

[client]
# SSH host running the daemon, for push-session.py. Env: TELECLAUDE_HOST.
# ssh_host = "my-server"
